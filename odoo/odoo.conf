; ---------------------------------------------------------------------------
; Odoo 19 CE configuration TEMPLATE.
;
; This file is NOT read directly. render-config.py substitutes every ${...} at
; container start and writes the result to $ODOO_RC (/opt/odoo/conf/odoo.conf,
; mode 0640). Reason: `admin_passwd` is a FileOnlyOption in odoo/tools/config.py
; — Odoo exposes no CLI flag and no environment variable for it, so rendering at
; runtime is the only way to keep the master password out of a tracked file.
;
; Every placeholder is supplied from the environment; defaults live in
; render-config.py and are mirrored in .env.example. Rendering fails hard on an
; unresolved placeholder rather than emitting an empty value.
;
; Option names were validated against this exact image's odoo/tools/config.py.
; Odoo only *warns* on an unknown key and then stores it unparsed, so a typo
; here is silent — do not add a key without checking it exists.
; ---------------------------------------------------------------------------
[options]

; --- Database connection ---------------------------------------------------
; These also feed /usr/local/bin/wait-for-psql.py, which reads $ODOO_RC before
; falling back to argv. That is deliberate: a password passed on the command
; line is readable by every process in the container through /proc/<pid>/cmdline.
db_host = ${ODOO_DB_HOST}
db_port = ${ODOO_DB_PORT}
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
db_maxconn = ${ODOO_DB_MAXCONN}

; template0, not template1. Grants for warehouse_reader are applied explicitly
; per database by scripts/lib/grants.sql, so no privilege ever arrives in a new
; tenant database by accident.
db_template = template0

# A COMMA-SEPARATED LIST, not a single database, and the queue_job runner is
# why. jobrunner/runner.py get_db_names() returns config["db_name"] when it is
# set and only falls back to listing databases when it is not, so a single name
# here means the runner watches that database and no other -- measured: with
# `bct` alone it logged "queue job runner ready for db bct" and never saw a job
# enqueued in athera_admin. Provisioning is a job in the ADMIN database, so the
# admin database has to be in this list or the Provision button queues work
# nothing will ever run.
#
# ODOO_DB_NAME stays the single default database for the CLI and for every
# script; ODOO_DB_NAMES is only this list.
db_name = ${ODOO_DB_NAMES}
; Anchored at both ends so the filter cannot be widened by a substring match.
dbfilter = ${ODOO_DBFILTER}

; --- Database manager ------------------------------------------------------
; list_db off hides /web/database/manager and stops the database selector from
; enumerating tenants to anonymous callers. Multi-tenant by construction means
; databases come from scripts/tenant-provision.sh, never from the web UI.
list_db = ${ODOO_LIST_DB}
; Master password: `changeme` in .env.example, a real value generated into .env
; by scripts/gen-env-secrets.py, never committed.
admin_passwd = ${ODOO_ADMIN_PASSWD}

; --- Addons ----------------------------------------------------------------
; /mnt/extra-addons is the mount point owned by the Platform-Addons agent.
; Platform-Infra provides the mount and this path entry, and writes no module.
;
; The group directories come from the imported odoo-platform suite (ADR 0002).
; Order is load order and it matters: a later entry can extend an earlier one,
; never the reverse. The bare mount stays FIRST so this repo's own five modules
; keep their existing paths and win any name collision against an import.
addons_path = /mnt/extra-addons,/mnt/extra-addons/_vendor,/mnt/extra-addons/core,/mnt/extra-addons/control_plane,/mnt/extra-addons/compliance,/mnt/extra-addons/ee_gap,/mnt/extra-addons/operations,/mnt/extra-addons/verticals,/mnt/extra-addons/_tenants,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- HTTP ------------------------------------------------------------------
http_enable = True
http_interface = 0.0.0.0
http_port = ${ODOO_HTTP_PORT}
gevent_port = ${ODOO_LONGPOLLING_PORT}

; proxy_mode makes Odoo trust X-Forwarded-For / X-Forwarded-Proto. Required
; because this service sits behind a reverse proxy in every environment above
; dev: without it every session is attributed to the proxy's IP and secure
; cookie detection breaks behind TLS termination.
proxy_mode = ${ODOO_PROXY_MODE}

; --- Workers and limits ----------------------------------------------------
; Sized for a dev box and for the single-VPS target in docs/adr/0001.
; Multi-process (workers > 0) rather than threaded, so limit_memory_* actually
; bounds a leak: a worker over the hard limit is killed and respawned instead of
; taking the whole server down.
;
; Worst case is workers * limit_memory_hard; idle RSS is far lower. The measured
; base-stack figure is recorded in docs/agents/contracts/04-platform.md.
workers = ${ODOO_WORKERS}
max_cron_threads = ${ODOO_MAX_CRON_THREADS}
limit_memory_soft = ${ODOO_LIMIT_MEMORY_SOFT}
limit_memory_hard = ${ODOO_LIMIT_MEMORY_HARD}
limit_request = ${ODOO_LIMIT_REQUEST}
limit_time_cpu = ${ODOO_LIMIT_TIME_CPU}
limit_time_real = ${ODOO_LIMIT_TIME_REAL}
limit_time_real_cron = ${ODOO_LIMIT_TIME_REAL_CRON}

; --- Logging ---------------------------------------------------------------
; stderr only: `logfile` is intentionally absent so Odoo logs to stderr and the
; container runtime owns rotation (the *default-logging anchor in
; docker-compose.yml). A logfile inside the volume would bypass that and grow
; unbounded. log_handler is also intentionally absent — it is an `append`-type
; option whose config-file form is fragile; use --log-level / --log-handler on
; the CLI for one-off debugging instead.
log_level = ${ODOO_LOG_LEVEL}
syslog = False
; log_db is intentionally absent. It names a database to log INTO, not a
; boolean; setting it to False makes Odoo 19 emit
;   "option log_db reads 'False' ... but isn't a boolean option, skip"
; on every start. Absent is already off.

; --- Behaviour -------------------------------------------------------------
; Odoo 19 narrowed this to a plain boolean. The pre-19 value 'all' now logs
;   "option without_demo: since 19.0, invalid boolean value: 'all', assume True"
; so use True. Demo data must never reach a tenant database.
without_demo = ${ODOO_WITHOUT_DEMO}
; queue_job must be loaded server-wide, not merely installed: its runner starts
; with the server. Nine imported modules dispatch jobs through it (retail_import,
; retail_import_api, whatsapp, esb_connector, brd_analyzer, fnb_stock_ops,
; email_marketing, finance_portal_sap, receipt_async).
server_wide_modules = base,web,queue_job

; --- Email -----------------------------------------------------------------
email_from = ${ODOO_EMAIL_FROM}
smtp_server = ${ODOO_SMTP_SERVER}
smtp_port = ${ODOO_SMTP_PORT}
