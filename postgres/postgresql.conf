# ===========================================================================
# PostgreSQL 16 — Odoo OLTP primary for project odoo19-bct.
#
# Loaded with `-c config_file=/etc/postgresql/postgresql.conf`, i.e. from
# OUTSIDE $PGDATA. When config_file lives outside the data directory,
# data_directory / hba_file / ident_file no longer default correctly, so all
# three are set explicitly below. Removing them makes the server refuse to
# start with "could not open configuration file".
#
# THE MOST IMPORTANT LINES IN THIS FILE ARE IN THE "Logical decoding" SECTION.
# They are set at FIRST BOOT on purpose (docs/adr/0001-analytics-warehouse.md):
# enabling logical decoding later would mean restarting a live Odoo, and this
# way Phase 3 CDC needs no restart of shared infrastructure at all.
# ===========================================================================

# --- File locations --------------------------------------------------------
data_directory = '/var/lib/postgresql/data'
hba_file       = '/var/lib/postgresql/data/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pg_ident.conf'

# --- Connections -----------------------------------------------------------
listen_addresses = '*'          # container network only; the host publishes
                                # 127.0.0.1:35432 and nothing else.
port = 5432
max_connections = 100
superuser_reserved_connections = 3
# Enough headroom that a saturated Odoo pool cannot lock the DBA out.

# --- Memory ----------------------------------------------------------------
# Sized for the single-VPS target in docs/adr/0001 (base stack must idle under
# 4 GiB with Odoo and Redis alongside), not for a dedicated database host.
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 128MB
work_mem = 8MB
# work_mem is per sort/hash node, not per query. 100 connections * a few nodes
# each is why this is 8MB and not 64MB.
temp_buffers = 8MB
huge_pages = try

# ===========================================================================
# Logical decoding — Phase 3 CDC depends on every line in this block.
# ===========================================================================

# Emits enough WAL for logical decoding (pgoutput). Odoo does not care; the
# cost is extra WAL volume on the source, accepted in docs/adr/0001.
wal_level = logical

# One publication + one replication slot per tenant database (ADR 0001,
# "Multi-tenant"). 10 leaves room for tenants plus ad-hoc resync slots.
max_replication_slots = 10
max_wal_senders = 10

# ---------------------------------------------------------------------------
# THE SAFETY VALVE. Do not remove, do not set to -1.
#
# An inactive or lagging replication slot makes Postgres retain WAL forever.
# On a single VPS that fills the disk, and a full disk takes ODOO down — a
# warehouse outage becomes an ERP outage (master prompt anti-pattern 7.9).
#
# With this cap, a slot that falls more than 2GB behind is invalidated by
# Postgres and its WAL is released. The warehouse then needs a resync. That is
# the deliberate trade: sacrifice the warehouse, protect the ERP.
#
# It is load-bearing, so it is also monitored: see
# observability/prometheus/rules/platform.rules.yml, which warns at 512 MiB and
# pages at 1 GiB of retained WAL — i.e. with half the cap still in hand.
# ---------------------------------------------------------------------------
max_slot_wal_keep_size = 2GB

# Physical-standby knob, kept small: this cluster has no streaming replica, and
# slot retention above is what CDC actually relies on.
wal_keep_size = 128MB
wal_sender_timeout = 60s
wal_receiver_timeout = 60s

# --- Write-ahead log -------------------------------------------------------
wal_compression = lz4
synchronous_commit = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 128MB
wal_buffers = 16MB

# --- Planner ---------------------------------------------------------------
random_page_cost = 1.1          # SSD-backed volume
effective_io_concurrency = 200
default_statistics_target = 100

# --- Background workers ----------------------------------------------------
# max_worker_processes must cover parallel workers AND logical replication
# workers; leaving it at the default while adding CDC is a classic way to get
# "out of background worker slots" during a resync.
max_worker_processes = 12
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum ------------------------------------------------------------
# Odoo writes hot, narrow tables (mail_message, ir_attachment, bus_bus). The
# defaults let them bloat; these are tightened deliberately.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# --- Statistics / monitoring ----------------------------------------------
# pg_stat_statements is what postgres_exporter and slow-query triage read.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.save = on
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096

# --- Logging ---------------------------------------------------------------
# stderr only. The container runtime owns rotation (json-file driver); a
# logging_collector writing inside the volume would bypass it and grow forever.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_min_duration_statement = 1000   # ms; slow-query surface, not a firehose
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10000
log_connections = off
log_disconnections = off
log_timezone = 'UTC'

# --- Locale / defaults -----------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
# lc_* are intentionally left unset so they inherit from initdb / the container
# environment; pinning them here breaks on musl-based images.

# --- Statement safety ------------------------------------------------------
# 0 = disabled globally. Odoo runs legitimately long migrations and installs;
# per-role limits belong on the analytics roles, not on the ERP owner.
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 300000   # 5 min; reaps leaked ORM cursors

# --- Local overrides -------------------------------------------------------
# Optional, untracked, mounted by an operator. Last include wins, so anything
# here overrides the settings above.
include_if_exists = '/etc/postgresql/conf.d/local.conf'
