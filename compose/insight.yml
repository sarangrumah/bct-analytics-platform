# ===========================================================================
# ATHERA Insight — the dashboarding product, end to end.
#
#   make up-insight        (adds these on top of the odoo stack)
#   make down-insight      (removes only these; the odoo stack keeps running)
#
# One of four product stacks (compose/odoo.yml, compose/insight.yml,
# compose/platform.yml, compose/agent.yml). The split is by PRODUCT so that a
# product can later be moved to its own VPS by changing URLs in .env and
# nothing else. Everything a dashboard needs is here: the warehouse, the
# loader that fills it, the metric layer that serves it and the browser
# surface that renders it.
#
# NOT here, deliberately: login-gateway. It is the diagram's Login node and is
# shared by all three products, so it belongs to the platform stack. A product
# stack that owned the identity provider could not be moved independently.
#
# WHAT MULTIPLIES PER CLIENT: only `cdc`. One loader binds to one tenant
# database with its own publication and slot. The warehouse does NOT multiply
# — tenants are separated inside it by FORCE ROW LEVEL SECURITY on tenant_id,
# which is a stronger boundary than a second container would be.
#
# This file is an OVERLAY on the same compose project, exactly as
# compose/observability.yml is (contract 04 §1, option A). It is never
# a separate project: `-p odoo19-bct` plus `networks: [bct]` means the
# warehouse resolves `postgres:5432` by service name with no external network
# declaration and no orphan-container warning.
#
# SCOPING. This host also runs odoo19-platform-*, odoo19-analytics-* and
# smart-warga-postgres-1. Every invocation is scoped `-p odoo19-bct`. There is
# no target in the Makefile that can reach another project, and nothing here
# is ever brought down with a bare `docker compose down`.
#
# PORTS. 127.0.0.1:35433 only — reserved for the warehouse in contract 04 §4.
# Nothing else in this file publishes a host port.
#
# MEMORY. The ADR budgets the warehouse at <= 1 GiB under load against a VPS
# that already carries ~1.29 GiB. mem_limit is set rather than assumed, so a
# runaway query is bounded by the container rather than by the host's OOM
# killer picking a victim (which on this host has already once been Odoo's
# asset compiler).
#
# IMAGE PINNING. Digests inline, matching the base stack, never from .env.
# A digest is a security control, not a tunable.
# ===========================================================================

x-restart-policy: &restart-policy
  restart: unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # =========================================================================
  # warehouse-db — Postgres 16, the analytical store.
  #
  # Same image and digest as the OLTP primary. One engine to operate, patch
  # and back up: that is the whole point of ADR 0001 option A.
  #
  # ROLES, and why there are three rather than one:
  #
  #   warehouse_admin  superuser, POSTGRES_USER, created by initdb. Runs the
  #                    init DDL and the backups. Nothing else uses it.
  #   warehouse        NOSUPERUSER NOBYPASSRLS. Owns raw/staging/marts/
  #                    warehouse and is what dbt connects as. Because it is
  #                    NOT a superuser it is subject to the RLS policies on
  #                    its own tables (which are FORCE ROW LEVEL SECURITY),
  #                    so `SET app.tenant_id` genuinely constrains it.
  #   warehouse_loader NOSUPERUSER. Backend's CDC loader: INSERT into raw.*,
  #                    read/write warehouse.pipeline_state, read
  #                    warehouse.column_policy. No CREATE, no marts.
  #   warehouse_rls    NOSUPERUSER NOBYPASSRLS, SELECT only. The identity the
  #                    semantic-api uses. It has NO unscoped policy at all, so
  #                    with app.tenant_id unset it sees zero rows — fail
  #                    closed, per master prompt §3.3.
  #
  # A single superuser role would have made every RLS test vacuous, because a
  # superuser bypasses row security unconditionally and no policy can stop it.
  # =========================================================================
  warehouse-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-warehouse-db
    <<: [*restart-policy, *hardening]
    logging: *default-logging
    # Identical to the OLTP primary's set: the entrypoint starts as root to
    # chown $PGDATA and then drops to uid 70 via su-exec.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    stop_grace_period: 1m
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?WAREHOUSE_ADMIN_PASSWORD is required - run `make dev-bootstrap`}
      PGDATA: /var/lib/postgresql/data
      PGDATABASE: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by analytics/warehouse/init/00-bootstrap.sh, which injects
      # them into psql with -v so no credential reaches a SQL file on disk.
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?WAREHOUSE_DB_PASSWORD is required - run `make dev-bootstrap`}
      WAREHOUSE_LOADER_USER: ${WAREHOUSE_LOADER_USER:-warehouse_loader}
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?WAREHOUSE_LOADER_PASSWORD is required - run `make dev-bootstrap`}
      WAREHOUSE_RLS_USER: ${WAREHOUSE_RLS_USER:-warehouse_rls}
      WAREHOUSE_RLS_PASSWORD: ${WAREHOUSE_RLS_PASSWORD:?WAREHOUSE_RLS_PASSWORD is required - run `make dev-bootstrap`}
      TZ: ${TZ:-UTC}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - warehousedata:/var/lib/postgresql/data
      - ../analytics/warehouse/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Only files directly in this directory are executed by the entrypoint;
      # init/sql/ is a subdirectory and is skipped, which is what lets
      # 00-bootstrap.sh apply it with psql -v.
      - ../analytics/warehouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WAREHOUSE_HOST_PORT:-35433}:5432"
    healthcheck:
      # -h 127.0.0.1 forces a real TCP handshake; the unix socket answers
      # during initdb and would report healthy before the listener is open.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bct

  # =========================================================================
  # warehouse-exporter — postgres_exporter over the WAREHOUSE database.
  #
  # Distinct from the observability overlay's postgres-exporter, which watches
  # the OLTP primary and is where replication-slot lag comes from (contract 04
  # §3). This one carries the warehouse-side series the analytics dashboard
  # and alerts need: reconciliation state, mart age, pipeline progress. All of
  # them are defined in analytics/warehouse/exporter/queries.yml and all of
  # them are namespaced bct_warehouse_* so they cannot collide with Backend's
  # bct_cdc_* set.
  #
  # It connects as warehouse_rls — NOT as an admin — because the series it
  # needs come from warehouse.* metadata tables, and an exporter reachable by
  # every Grafana Editor should hold the narrowest identity that answers the
  # question (the same reasoning contract 04 §7 applies to postgres-oltp).
  # =========================================================================
  warehouse-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-warehouse-exporter
    <<: [*restart-policy, *hardening]
    logging: *default-logging
    user: "65534:65534"
    mem_limit: 128m
    # ONLY the custom queries, none of the exporter's built-in collectors.
    #
    # Two reasons, and the first one is a real access-control decision rather
    # than tidiness. The built-in `wal` collector calls pg_ls_waldir(), which
    # needs pg_monitor. This exporter connects as warehouse_rls - the SAME
    # identity the semantic-api uses - and widening that role to pg_monitor to
    # silence a log line would widen the serving identity. The collector is
    # turned off instead. (It logged `permission denied for function
    # pg_ls_waldir` on every scrape until this was added; least privilege is
    # working, not failing.)
    #
    # Second: generic Postgres metrics for this cluster are not interesting
    # here. Replication-slot lag lives on the OLTP primary, which the
    # observability overlay's postgres-exporter already covers. This exporter
    # exists for the bct_warehouse_* series and nothing else.
    command:
      - --disable-default-metrics
      - --disable-settings-metrics
    environment:
      DATA_SOURCE_NAME: "postgresql://${WAREHOUSE_RLS_USER:-warehouse_rls}:${WAREHOUSE_RLS_PASSWORD:?WAREHOUSE_RLS_PASSWORD is required}@warehouse-db:5432/${WAREHOUSE_DB:-warehouse}?sslmode=disable&application_name=warehouse-exporter"
      # application_name is what makes this exporter's connections separable
      # in pg_stat_activity. It shares the warehouse_rls role with the
      # semantic-api, so usename cannot tell them apart - which is why the
      # connection-budget entry for postgres_exporter is labelled UNVERIFIED
      # in warehouse_ctl.py, and why a `warehouse_rls = 2` reading earlier in
      # this build could not be attributed to either consumer. dbt already
      # sets `dbt` and warehouse_ctl sets `warehouse_ctl`; this was the one
      # connection nobody could name.
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    volumes:
      - ../analytics/warehouse/exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
    depends_on:
      warehouse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bct

  # =========================================================================
  # dbt — the transformation runner.
  #
  # `profiles: [tools]` keeps it OUT of `up`. dbt is a batch job, not a
  # service: leaving a restart-policy container idling would burn ~150 MiB of
  # a VPS budget for something that runs for 20 seconds every few minutes.
  # `make dbt-run` / `make dbt-test` invoke it with `run --rm`.
  #
  # No scheduler. ADR 0001 settled that: the CDC consumer is long-running and
  # the only scheduled work is `dbt build` on an interval, which does not
  # justify Airflow or Dagster on this host.
  # =========================================================================
  dbt:
    build:
      context: ../analytics/dbt
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-dbt:local
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-dbt
    profiles: [tools]
    <<: *hardening
    logging: *default-logging
    restart: "no"
    mem_limit: 512m
    environment:
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?WAREHOUSE_DB_PASSWORD is required}
      WAREHOUSE_ADMIN_USER: ${WAREHOUSE_ADMIN_USER:-warehouse_admin}
      WAREHOUSE_ADMIN_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?WAREHOUSE_ADMIN_PASSWORD is required}
      # Read-only identity on the OLTP side. warehouse_ctl.py never opens any
      # other connection to Odoo, so "never write to the Odoo database" holds
      # because the role cannot, not because the code is careful.
      ODOO_PG_HOST: ${POSTGRES_HOST:-postgres}
      ODOO_PG_PORT: "5432"
      ODOO_DB_NAME: ${ODOO_DB_NAME:-bct}
      WAREHOUSE_READER_USER: ${WAREHOUSE_READER_USER:-warehouse_reader}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?WAREHOUSE_READER_PASSWORD is required}
      # Per-tenant HMAC salts. SOPS-managed, `changeme` in .env.example, never
      # in a tracked file. warehouse.tenant_registry stores only the NAME.
      WAREHOUSE_MASK_SALT_DEFAULT: ${WAREHOUSE_MASK_SALT_DEFAULT:?WAREHOUSE_MASK_SALT_DEFAULT is required}
      WAREHOUSE_MASK_SALT_BCT: ${WAREHOUSE_MASK_SALT_BCT:?WAREHOUSE_MASK_SALT_BCT is required}
      DBT_PROFILES_DIR: /dbt
      DBT_THREADS: ${DBT_THREADS:-4}
      # Not used by dbt. Read by warehouse_ctl.py verify, whose connection
      # budget check has to see the SAME value the semantic-api is actually
      # running with. Reading it in a container that never receives it would
      # be worse than a literal: it would LOOK live while always returning
      # the default. Default matches Backend's own (contract 06 s9).
      SEMANTIC_API_POOL_MAX: ${SEMANTIC_API_POOL_MAX:-16}
      TZ: ${TZ:-UTC}
    volumes:
      # Read-write: dbt writes target/ and logs/ into the project directory,
      # and `dbt docs` needs the catalog to persist for the operator to read.
      - ../analytics/dbt:/dbt
      # Read-only: warehouse_ctl.py runs here rather than on the host because
      # this image already carries psycopg2 and can reach BOTH databases, so
      # the tooling has no host Python dependency at all.
      - ../analytics/warehouse:/warehouse:ro
    working_dir: /dbt
    depends_on:
      warehouse-db:
        condition: service_healthy
    networks:
      - bct

  # =========================================================================
  # semantic-api — the metric layer. POST /v1/query, compiled from the metric
  # contract; no raw SQL is ever accepted.
  #
  # Promoted from scripts/analytics/semantic-run.sh on 2026-09-01. It had a
  # working Dockerfile and a reserved port but no compose service at all, which
  # meant `odoo19-bct-semantic-api:local` was RUN by a script and BUILT by
  # nothing — a fresh clone could not start it. It was also invisible to
  # `docker compose ps`, `make down` and `make stats`, and `docker run --rm`
  # made `docker stop` delete it outright.
  #
  # Connects as warehouse_rls: SELECT only, NOSUPERUSER NOBYPASSRLS, so row
  # security genuinely applies. Never as `warehouse` (dbt's transform role has
  # an unscoped policy) and never as `warehouse_admin` (a superuser bypasses
  # RLS unconditionally). Contract 05 §A.2.
  #
  # It holds ONE database DSN, to the warehouse, and has no route to Odoo's
  # OLTP Postgres at all. That is how anti-pattern 7.3 is prevented
  # structurally rather than by policy.
  # =========================================================================
  semantic-api:
    build:
      context: ../analytics/semantic-api
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-semantic-api:local
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-semantic-api
    <<: [*restart-policy, *hardening]
    logging: *default-logging
    read_only: true
    mem_limit: 512m
    environment:
      # Assembled here rather than in a script so the service is startable from
      # compose alone. Same shape semantic-run.sh built by hand.
      SEMANTIC_API_WAREHOUSE_DSN: "host=${SEMANTIC_API_WAREHOUSE_HOST:-warehouse-db} port=${SEMANTIC_API_WAREHOUSE_PORT:-5432} dbname=${WAREHOUSE_DB:-warehouse} user=${WAREHOUSE_RLS_USER:-warehouse_rls} password=${WAREHOUSE_RLS_PASSWORD:?WAREHOUSE_RLS_PASSWORD is required}"
      # Service name, not container name. Both resolve on this network, but the
      # service name is the one that survives being moved to another host with
      # only an .env change — see docs/architecture.md on the VPS split.
      SEMANTIC_API_JWKS_URL: ${SEMANTIC_API_JWKS_URL:-http://login-gateway:8080/.well-known/jwks.json}
      SEMANTIC_API_JWT_ISSUER: ${SEMANTIC_API_JWT_ISSUER:-${LOGIN_GATEWAY_JWT_ISSUER:-https://login-gateway.local/}}
      SEMANTIC_API_JWT_AUDIENCE: ${SEMANTIC_API_JWT_AUDIENCE:-${LOGIN_GATEWAY_JWT_AUDIENCE:-insight-portal}}
      SEMANTIC_API_MAX_LIMIT: ${SEMANTIC_API_MAX_LIMIT:-5000}
      # Sized against the warehouse's connection budget, not the panel count:
      # max_connections 40 - 3 reserved = 37, less dbt 5, exporter ~3, CDC 3,
      # ad-hoc psql ~4, margin. warehouse_ctl.py verify checks the total.
      SEMANTIC_API_POOL_MAX: ${SEMANTIC_API_POOL_MAX:-16}
      SEMANTIC_API_POOL_ACQUIRE_TIMEOUT_MS: ${SEMANTIC_API_POOL_ACQUIRE_TIMEOUT_MS:-2000}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SEMANTIC_API_HOST_PORT:-38200}:8080"
    depends_on:
      warehouse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bct

  # =========================================================================
  # cdc — the logical-replication loader. Odoo's WAL to the landing zone.
  #
  # ONE PROCESS PER TENANT. The loader binds to a single CDC_TENANT_DB with its
  # own publication `bct_cdc_<slug>` and slot `bct_slot_<slug>`; it cannot
  # serve two databases. A second client therefore means a second copy of this
  # service, not a bigger one — see docs/architecture.md.
  #
  # `restart: unless-stopped` because this is a long-running consumer, not a
  # batch job. The previous `docker run --rm` form meant `docker stop` DELETED
  # the container and a later `docker start` failed with "no such container".
  #
  # ORDERING: the publication must exist BEFORE this starts, because the
  # consumer creates the slot at the end of its own startup checks. That is
  # what `make cdc-start` sequences. Starting this service without a
  # publication is a startup failure, not a silent no-op.
  # =========================================================================
  cdc:
    build:
      context: ../analytics/cdc
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-cdc:local
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-cdc
    <<: [*restart-policy, *hardening]
    logging: *default-logging
    read_only: true
    mem_limit: 512m
    environment:
      WAREHOUSE_READER_USER: ${WAREHOUSE_READER_USER:-warehouse_reader}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?WAREHOUSE_READER_PASSWORD is required}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      WAREHOUSE_LOADER_USER: ${WAREHOUSE_LOADER_USER:-warehouse_loader}
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?WAREHOUSE_LOADER_PASSWORD is required}
      # The loader refuses to start rather than hash unkeyed, so a missing salt
      # is a startup failure and never a silently weaker digest.
      WAREHOUSE_MASK_SALT_DEFAULT: ${WAREHOUSE_MASK_SALT_DEFAULT:?WAREHOUSE_MASK_SALT_DEFAULT is required}
      WAREHOUSE_MASK_SALT_BCT: ${WAREHOUSE_MASK_SALT_BCT:?WAREHOUSE_MASK_SALT_BCT is required}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-bct}
      CDC_TENANT_DB: ${CDC_TENANT_DB:-${ODOO_DB_NAME:-bct}}
      CDC_TENANT_SLUG: ${CDC_TENANT_SLUG:-${ODOO_DB_NAME:-bct}}
      CDC_WAREHOUSE_HOST: ${CDC_WAREHOUSE_HOST:-warehouse-db}
      CDC_SOURCE_HOST: ${CDC_SOURCE_HOST:-postgres}
      CDC_ODOO_URL: ${CDC_ODOO_URL:-http://odoo:8069}
      CDC_ODOO_LOGIN: ${CDC_ODOO_LOGIN:-}
      CDC_ODOO_PASSWORD: ${CDC_ODOO_PASSWORD:-}
      # The cross-language digest check runs only when an Odoo login is also
      # configured (runner.py). A non-Odoo Insight source leaves both unset and
      # skips it — the check is about agreeing with custom_pdp_masking, and a
      # client's own application has no such module to agree with.
      CDC_VERIFY_DIGEST_SPEC: ${CDC_VERIFY_DIGEST_SPEC:-1}
      CDC_BATCH_SIZE: ${CDC_BATCH_SIZE:-2000}
      CDC_SOURCE_TABLES: ${CDC_SOURCE_TABLES:-}
      CDC_PUBLICATION: ${CDC_PUBLICATION:-}
      CDC_SLOT: ${CDC_SLOT:-}
      TZ: ${TZ:-UTC}
    depends_on:
      warehouse-db:
        condition: service_healthy
    networks:
      - bct

  # =========================================================================
  # insight-portal — ATHERA Insight's browser surface. Next.js, standalone.
  #
  # Folded in from insight-portal/docker-compose.portal.yml on 2026-09-01.
  # That file declared the network `external: true` and had no depends_on, so
  # nothing sequenced the portal after the two services it cannot work without
  # — and the Makefile never referenced it at all.
  #
  # No secret of any kind reaches this service. It holds no database DSN, no
  # signing key and no salt, because it needs none: it authenticates users
  # through the gateway and reads figures through the semantic API.
  # =========================================================================
  insight-portal:
    build:
      context: ../insight-portal
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-insight-portal:local
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}-insight-portal
    <<: [*restart-policy, *hardening]
    logging: *default-logging
    read_only: true
    user: "10004:10004"
    mem_limit: 512m
    environment:
      INSIGHT_PORTAL_SEMANTIC_API_URL: ${INSIGHT_PORTAL_SEMANTIC_API_URL:-http://semantic-api:8080}
      INSIGHT_PORTAL_LOGIN_GATEWAY_URL: ${INSIGHT_PORTAL_LOGIN_GATEWAY_URL:-http://login-gateway:8080}
      INSIGHT_PORTAL_JWKS_URL: ${INSIGHT_PORTAL_JWKS_URL:-http://login-gateway:8080/.well-known/jwks.json}
      INSIGHT_PORTAL_JWT_ISSUER: ${LOGIN_GATEWAY_JWT_ISSUER:-https://login-gateway.local/}
      INSIGHT_PORTAL_JWT_AUDIENCE: ${LOGIN_GATEWAY_JWT_AUDIENCE:-insight-portal}
      INSIGHT_PORTAL_ODOO_DB: ${ODOO_DB_NAME:-bct}
      # Plain HTTP on a loopback port in development. Set true behind TLS; the
      # cookie is httpOnly and SameSite=Strict either way.
      INSIGHT_PORTAL_COOKIE_SECURE: ${INSIGHT_PORTAL_COOKIE_SECURE:-false}
      INSIGHT_PORTAL_REQUEST_TIMEOUT_MS: ${INSIGHT_PORTAL_REQUEST_TIMEOUT_MS:-8000}
      INSIGHT_PORTAL_CACHE_TTL_SECONDS: ${INSIGHT_PORTAL_CACHE_TTL_SECONDS:-30}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${INSIGHT_PORTAL_HOST_PORT:-33000}:3000"
    tmpfs:
      # Next writes nothing at runtime except what the OS needs; /tmp is given
      # explicitly so the root filesystem can stay read-only.
      - /tmp:size=16m,mode=1777
    depends_on:
      semantic-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - bct

networks:
  bct:
    name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}_bct
    driver: bridge

volumes:
  warehousedata:
    name: ${COMPOSE_PROJECT_NAME:-odoo19-bct}_warehousedata
