[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --tb=short
markers =
    live: needs the odoo19-bct stack running
    destructive: mutates state (creates/deletes records, stops services); never run against production
    slow: takes more than ~60 s
    coldstart: removes and recreates project volumes; opt-in only via RUN_COLDSTART=1
    notyet: the component under test does not exist yet; the test is written and reported as NOT RUN
