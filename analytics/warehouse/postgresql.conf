# ===========================================================================
# PostgreSQL 16 — analytics warehouse for project odoo19-bct.
#
# Loaded with `-c config_file=/etc/postgresql/postgresql.conf`, i.e. from
# OUTSIDE $PGDATA, so data_directory / hba_file / ident_file must all be set
# explicitly or the server refuses to start. Same convention as the OLTP
# primary's postgres/postgresql.conf; read that file's header first.
#
# THIS CLUSTER IS NOT THE ERP. The differences from the OLTP config are all
# deliberate and each one is justified where it appears:
#
#   * NO logical decoding. wal_level stays `replica`. The warehouse is a
#     replication *target*, never a source. Setting wal_level=logical here
#     would buy nothing and cost WAL volume on a 1 GiB container.
#   * Analytics-shaped memory: far fewer connections, much more work_mem per
#     connection, because a dbt run is a handful of large sorts and hash joins
#     rather than a hundred small OLTP statements.
#   * statement_timeout is ON. On the ERP a long statement is a migration; here
#     it is a runaway dashboard query, and the container has a 1 GiB hard
#     limit that a runaway hash join will hit before the query finishes.
#
# MEMORY BUDGET. mem_limit is 1g in compose/insight.yml, per ADR 0001
# ("<= 1 GiB under load"). shared_buffers + a plausible concurrent work_mem
# fan-out has to fit inside that with room for the backends themselves, which
# is what the numbers below are sized against — not against the 15 GiB the dev
# workstation happens to have.
# ===========================================================================

# --- File locations --------------------------------------------------------
data_directory = '/var/lib/postgresql/data'
hba_file       = '/var/lib/postgresql/data/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pg_ident.conf'

# --- Connections -----------------------------------------------------------
listen_addresses = '*'          # container network only; the host publishes
                                # 127.0.0.1:35433 and nothing else.
port = 5432
# Deliberately small. Consumers are: dbt (4 threads), the CDC loader, the
# semantic API's pool, the exporter, and a human. A large max_connections on a
# 1 GiB container is a way to convert a traffic spike into an OOM kill.
max_connections = 40
superuser_reserved_connections = 3

# --- Memory ----------------------------------------------------------------
shared_buffers = 192MB
effective_cache_size = 512MB
maintenance_work_mem = 96MB     # index builds after a dbt full refresh
# 16MB * a few nodes * ~10 real concurrent sessions stays well inside the
# container limit. This is double the OLTP value because the workload is the
# opposite shape: few sessions, large sorts.
work_mem = 16MB
temp_buffers = 16MB
huge_pages = try

# --- Write-ahead log -------------------------------------------------------
# `replica`, NOT `logical`. See the header.
wal_level = replica
max_replication_slots = 0
max_wal_senders = 0
wal_compression = lz4
# dbt rebuilds tables wholesale. Frequent small checkpoints during a full
# refresh are pure write amplification on a volume this size.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 128MB
wal_buffers = 16MB
# The warehouse is re-derivable from Odoo by definition: losing the last few
# hundred milliseconds of committed transactions costs a re-run of `dbt build`,
# not data. This is the one durability trade worth making here, and it is worth
# roughly 2-3x on bulk insert throughput during a snapshot load.
synchronous_commit = off

# --- Planner ---------------------------------------------------------------
random_page_cost = 1.1          # SSD-backed volume
effective_io_concurrency = 200
# Marts are grouped and filtered on tenant_id, date_day and operating_unit_id
# on every query. 100 buckets on a 12-month fact is a coarse histogram and the
# planner picks sequential scans it should not.
default_statistics_target = 250

# --- Background workers ----------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum ------------------------------------------------------------
# The landing zone is append-only, so it never needs vacuuming for bloat — but
# it very much needs ANALYZE, because a raw table that grew from 0 to 500k rows
# with stale statistics makes every stg_ model plan against an empty table.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# --- Statistics / monitoring ----------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.save = on
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096

# --- Logging ---------------------------------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d/%a '
# Lower than the ERP's 1000ms. The Phase 4 budget is p95 under 2s for a mart
# query; anything over 2s here is a fact worth having in the log.
log_min_duration_statement = 2000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0              # a spilled sort means work_mem is wrong
log_autovacuum_min_duration = 10000
log_connections = off
log_disconnections = off
log_timezone = 'UTC'

# --- Locale / defaults -----------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# --- Statement safety ------------------------------------------------------
# 10 minutes globally: long enough for a full dbt refresh of the largest fact,
# short enough that a cartesian join dies instead of taking the container's
# memory limit with it. Per-role tightening for the read-only analytics roles
# is applied in init/sql/40-roles-grants.sql, where 60s is the ceiling for
# anything a dashboard can issue.
statement_timeout = 600000
lock_timeout = 30000
idle_in_transaction_session_timeout = 300000

# --- Local overrides -------------------------------------------------------
include_if_exists = '/etc/postgresql/conf.d/local.conf'
