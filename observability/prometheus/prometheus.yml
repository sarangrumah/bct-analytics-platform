# ---------------------------------------------------------------------------
# Prometheus configuration for project odoo19-bct.
#
# EXTENSION POINT: scrape_config_files below globs
# /etc/prometheus/scrape.d/*.yml, which is the host directory
# observability/prometheus/scrape.d/. The Data Warehouse agent owns the
# analytics-*.yml files that land there; Platform-Infra owns this mechanism and
# does not edit their content. Adding a scrape target is a new file plus a
# reload (--web.enable-lifecycle is on).
# ---------------------------------------------------------------------------
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    project: odoo19-bct
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml

# Drop-in scrape configs. Owned by other agents; see the header.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The source of replication-slot lag, connection counts and transaction
  # rates. This is the scrape the whole max_slot_wal_keep_size safety design
  # depends on: the cap protects Odoo, and this is how anyone finds out the cap
  # was approached.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          role: oltp

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  # Odoo CE exposes no Prometheus endpoint. Liveness comes from the container
  # healthcheck and detail comes from Loki. Recorded here as a named gap rather
  # than left as a silently missing target; a blackbox_exporter probe of
  # /web/health is the obvious fill if one is ever added.
  #
  # - job_name: odoo
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["odoo:8069"]
