# =====================================================================================
# CD - build, sign, attest, deploy by digest, roll back on failure.
#
# SOLE OWNER: the Security agent (master prompt 2.1). QA and every other agent send a
# diff request; they do not edit this file.
#
# THIS FILE HAS NEVER EXECUTED. There is no git remote by operator decision, so no run
# of this workflow exists. Everything below is written to be correct on the day a remote
# appears, and the parts that could be tested without one HAVE been, by extracting them
# into security/deploy/deploy.sh and exercising that against real containers:
#
#     bash security/deploy/test-rollback.sh    19/19, real rollback between two digests
#     bash security/deploy/test-signing.sh      9/9, real cosign sign/verify/attest
#
# security/CD-CONTRACT.md states exactly which acceptance criteria are verified by
# EXECUTION and which by REVIEW ONLY, and what must be re-run once a remote exists.
# Do not read a green CI badge as evidence that this workflow works.
#
# PINNING: every third-party action is a full 40-char commit SHA with its version in a
# trailing comment, resolved from the GitHub API. Runners are pinned to ubuntu-24.04.
# =====================================================================================

name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to deploy (must already be built and signed)"
        required: true
        type: string

# Least privilege at the top. `id-token: write` is NOT here - it is granted to the
# signing job alone, because a workflow-wide OIDC token is a credential every job in
# the file can mint signatures with.
permissions:
  contents: read

# A deploy is never cancelled mid-flight: cancelling between the swap and the health
# gate would leave the host on an unverified digest with nothing left running to roll
# it back.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUNNER_IMAGE: ubuntu-24.04

jobs:
  # ===================================================================================
  # 1. CI must be green for this exact commit (criterion 6).
  #
  # Not "CI ran recently" and not "the tag looks fine": the ci-gate check-run for THIS
  # commit SHA must have concluded success. ci-gate itself aggregates every CI job and
  # fails if any job failed, was cancelled, or was unexpectedly skipped, so this single
  # lookup transitively requires all of them.
  # ===================================================================================
  require-ci-green:
    name: require CI green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: ci-gate must be success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # python3, not jq: jq is absent on the operator host and nothing in this repo
          # may depend on it (PLAN.md environment baseline).
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --paginate \
            > check-runs.json
          python3 - <<'PY'
          import json, sys
          runs = json.load(open("check-runs.json"))["check_runs"]
          gate = [r for r in runs if r["name"] == "ci-gate"]
          if not gate:
              print("FAIL: no ci-gate check-run for this commit.", file=sys.stderr)
              print("CD requires CI to have run and passed. Push the commit, let CI "
                    "finish, then tag it.", file=sys.stderr)
              sys.exit(1)
          latest = sorted(gate, key=lambda r: r["started_at"])[-1]
          print(f"ci-gate: status={latest['status']} conclusion={latest['conclusion']}")
          if latest["status"] != "completed" or latest["conclusion"] != "success":
              print("FAIL: ci-gate is not green. Refusing to deploy.", file=sys.stderr)
              sys.exit(1)
          print("CI_GREEN_OK")
          PY

  # ===================================================================================
  # 2. Build, push, sign, attest.
  #
  # The matrix is generated from security/scan-targets.yml - the same single source of
  # truth the container-scan matrix uses, so an image cannot be deployable without also
  # being scannable. Adding an image is still a one-line change to that file.
  # ===================================================================================
  discover:
    name: discover deployable images
    needs: require-ci-green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.targets.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Coverage gate
        run: python3 security/scan_targets.py --check
      - id: targets
        run: echo "images=$(python3 security/scan_targets.py --matrix images)" >> "$GITHUB_OUTPUT"

  build-sign-attest:
    name: build+sign (${{ matrix.name }})
    needs: [require-ci-green, discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing - scoped to THIS job only
      attestations: write    # provenance attestation
    strategy:
      fail-fast: true        # do not deploy a half-built set
      matrix: ${{ fromJSON(needs.discover.outputs.images) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Skip images that do not exist yet
        if: ${{ !matrix.scan }}
        run: |
          echo "::notice title=CD skipped::${{ matrix.name }} has no Dockerfile yet (owner ${{ matrix.owner }}, wave ${{ matrix.wave }})"
          echo "### CD: \`${{ matrix.name }}\` SKIPPED - not built yet" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ matrix.scan }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        if: ${{ matrix.scan }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: ${{ matrix.scan }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: ${{ matrix.scan }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.slug }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        if: ${{ matrix.scan }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        if: ${{ matrix.scan }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: ${{ matrix.scan }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.slug }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Keyless: identity comes from the workflow's OIDC token, so no signing key
          # exists to leak. Signing the DIGEST, never a tag - a tag can be moved after
          # signing and the signature would still verify against the new content.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST}"

      - name: SLSA provenance attestation
        if: ${{ matrix.scan }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.slug }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify our own signature before anyone depends on it
        if: ${{ matrix.scan }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.slug }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # A signing step that logs success without signing is the exact failure this
          # phase exists to close (Phase 5 brief, gap 3). So the job proves its own
          # output rather than trusting that the previous step did something.
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| digest | \`${DIGEST}\` |"
            echo "| signature | verified in-job |"
            echo "| provenance | verified in-job |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================================
  # 3. Deploy.
  #
  # `environment: production` is where the required reviewers live. Approval is a
  # GitHub setting, not a line in this file - see security/CD-CONTRACT.md for the exact
  # settings that must be configured, because a missing reviewer requirement makes this
  # job auto-approve silently.
  # ===================================================================================
  deploy:
    name: deploy to production
    needs: [require-ci-green, discover, build-sign-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://bct.example.id
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the digest to deploy
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}/odoo
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Resolve the tag to an immutable digest HERE, once, and pass only the digest
          # onward. Everything downstream deploys and verifies that digest, so a tag
          # moved between now and the swap cannot change what runs.
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}' > digest.txt
          digest="$(cat digest.txt)"
          case "$digest" in
            sha256:*) ;;
            *) echo "could not resolve a digest for ${IMAGE}:${TAG}" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "deploying ${IMAGE}@${digest}"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Plain ssh rather than a third-party action: one less supply-chain dependency
          # on the path that reaches production, and host-key checking stays ON. A
          # deploy that accepts any host key is a deploy that can be pointed elsewhere.
          test -n "$SSH_KEY" || { echo "DEPLOY_SSH_KEY is not set on the production environment" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is not set - refusing to disable host key checking" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy, health-gate and roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}/odoo
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The script is piped from THIS commit rather than run from a checkout on the
          # host, so the deploy logic is always the version that was reviewed and tagged.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && \
               DEPLOY_SERVICE=odoo \
               DEPLOY_IMAGE='${IMAGE}' \
               DEPLOY_DIGEST='${DIGEST}' \
               DEPLOY_PROJECT=odoo19-bct \
               DEPLOY_TENANT=bct \
               HEALTH_TIMEOUT=300 \
               BACKUP_CMD='scripts/tenant-backup.sh bct' \
               VERIFY_CMD=\"cosign verify-attestation --type slsaprovenance \
                 --certificate-identity-regexp '^https://github.com/${REPO}/' \
                 --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                 '${IMAGE}@${DIGEST}'\" \
               MIGRATE_CMD='scripts/migrate-modules.sh bct' \
               HEALTH_CMD='scripts/post-deploy-health.sh bct' \
               bash -s" < security/deploy/deploy.sh

      - name: Report
        if: always()
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ github.ref_name }}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| result | ${{ job.status }} |"
            echo ""
            echo "A failed deploy has already rolled itself back to the previous digest;"
            echo "the job still reports failure, because a rolled-back deploy is a failed"
            echo "deploy. See the step log for the digest that was restored."
          } >> "$GITHUB_STEP_SUMMARY"
