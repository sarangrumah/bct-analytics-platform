# =====================================================================================
# CI - lint, SAST, SCA, secrets and container scanning.
#
# SOLE OWNER: the Security agent (master prompt 2.1, restated in every Phase 1 brief).
# No other agent edits this file. QA sends a diff request for test jobs and Security
# merges it. This is not territoriality: a workflow that anyone can edit is a workflow
# where anyone can delete the job that would have failed.
#
# cd.yml EXISTS as of Phase 5 and is owned by this same agent. It is tag-triggered and
# gated on `ci-gate` below; see security/CD-CONTRACT.md. (This comment read "THERE IS NO
# cd.yml" until 2026-08-31 - true when written, false the moment cd.yml landed. Stale
# prose in a header is the instance-8 shape: correct code, a description a future reader
# will act on. Header claims get re-read whenever this file changes.)
#
# PINNING
#   Every third-party action is pinned to a full 40-character commit SHA with its release
#   tag in a trailing comment. A tag is a movable pointer; `@v4` means "whatever the
#   maintainer, or whoever compromises the maintainer, points v4 at this morning".
#   Every scanner installed as a binary is pinned to a version AND verified against a
#   SHA-256 checksum recorded here, so a compromised release asset fails the download step
#   rather than scanning our code with a compromised scanner.
#   Runners are pinned to ubuntu-24.04, never ubuntu-latest: a runner image change must be
#   a commit, not a Tuesday.
#
# WHAT PHASE 5 CD WILL GATE ON
#   One required status check: `ci-gate`. It aggregates every job below and fails if any
#   of them failed or was cancelled. Adding a job automatically tightens the gate, and a
#   job that is removed shows up as a missing dependency rather than as a silent pass.
#   Full semantics: security/CI-CONTRACT.md.
#
# ADDING AN IMAGE OR A NODE SERVICE TO THE SCANS
#   You do not edit this file. Add one entry to security/scan-targets.yml; the matrices
#   below are generated from it. See security/CI-CONTRACT.md.
# =====================================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege at the workflow level. No job below needs more; if one ever does, it
# gets its own `permissions:` block rather than raising the ceiling for everything.
# `security-events: write` is deliberately absent - SARIF upload to code scanning needs
# Advanced Security, which this repository does not have. Reports are uploaded as
# artifacts instead, so no finding is lost.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

  # Scanner binaries: version + SHA-256 of the linux-amd64 release asset.
  # Verified against the upstream published checksum files on 2026-08-31.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
  OSV_SCANNER_VERSION: "2.5.1"
  OSV_SCANNER_SHA256: "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
  CYCLONEDX_NPM_VERSION: "6.0.1"

jobs:
  # ===================================================================================
  # discover - build the scan matrices from security/scan-targets.yml.
  # This is what makes "register an image" a one-line change in a file the owning agent
  # can be given, instead of an edit to a workflow only one agent may touch.
  # ===================================================================================
  discover:
    name: discover scan targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.targets.outputs.images }}
      node: ${{ steps.targets.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Registry parser self-test
        run: python3 security/scan_targets.py --selftest

      - name: Coverage gate - nothing ships unscanned
        # Hard-fails on a Dockerfile or package.json that no scan job covers
        # (master prompt 5.2). This is the control that keeps the registry honest:
        # you cannot add an image to the repo without adding it to the scans.
        run: python3 security/scan_targets.py --check

      - name: Build matrices
        id: targets
        run: |
          set -euo pipefail
          {
            echo "images=$(python3 security/scan_targets.py --matrix images)"
            echo "node=$(python3 security/scan_targets.py --matrix node)"
          } >> "$GITHUB_OUTPUT"

      - name: Report coverage
        if: always()
        run: python3 security/scan_targets.py --summary >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================================
  # lint - the same pre-commit hooks every agent runs locally. If this job and a local
  # `pre-commit run --all-files` ever disagree, the config is wrong, not the developer.
  # ===================================================================================
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Ignore-policy audit
        # Every scanner suppression carries a reason and an unexpired date, or this fails.
        run: python3 security/check_ignore_policy.py

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # ===================================================================================
  # sast - Semgrep.
  # Local rules block. Registry rules advise. A floating upstream ruleset that can turn
  # the merge path red without anyone committing anything is an availability risk on the
  # critical path, so its findings are uploaded and read, not enforced.
  # ===================================================================================
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Validate rule syntax
        run: semgrep --validate --config .semgrep/ --metrics=off

      - name: Semgrep - project rules (blocking)
        run: |
          set -euo pipefail
          # ONE scan, JSON only. This step used to pass `--json --output F --text`
          # together, and semgrep then wrote the TEXT report into F: the "machine
          # readable" artefact this job uploads was not JSON and could not be parsed.
          # Worse, the console printed only "Ran 28 rules on 183 files: 1 finding" - the
          # gate failed WITHOUT SAYING WHAT IT FOUND, and the reason had to be recovered
          # by downloading an artefact and reading it by eye. Both discovered on the
          # first real CI run, 2026-08-31.
          #
          # A gate that will not say why it refused is a gate people learn to route
          # around, so the findings are rendered below from the JSON, to the console AND
          # to the step summary. python3 not jq: jq is absent on the operator host and
          # nothing here may depend on it.
          status=0
          semgrep scan \
            --config .semgrep/ \
            --error \
            --metrics=off \
            --disable-version-check \
            --json --output semgrep-project.json || status=$?

          python3 - "$status" <<'PY'
          import json, os, sys
          status = int(sys.argv[1])
          try:
              with open("semgrep-project.json", encoding="utf-8") as fh:
                  doc = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              # The artefact being unparseable is itself the bug this rewrite fixes, so it
              # is fatal rather than ignored.
              print(f"FAIL: semgrep-project.json is not valid JSON ({exc}).", file=sys.stderr)
              sys.exit(1)

          results = doc.get("results", [])
          errors = doc.get("errors", [])
          scanned = len(doc.get("paths", {}).get("scanned", []))

          # EMPTY-RESULT RULE. "no findings" is the passing state, and it looks identical
          # whether the rules are clean or the scan matched no files at all. Assert the
          # population before believing the silence.
          if scanned == 0:
              print("FAIL: semgrep scanned 0 files. 'No findings' over an empty target set "
                    "is not a pass - the config or the checkout is broken.", file=sys.stderr)
              sys.exit(1)

          lines = []
          for r in results:
              lines.append(
                  f"- `{r['check_id']}`  \n"
                  f"  `{r['path']}`:{r['start']['line']}  \n"
                  f"  {r['extra']['message'].strip().splitlines()[0]}"
              )
              print(f"::error file={r['path']},line={r['start']['line']},"
                    f"title={r['check_id']}::{r['extra']['message'].strip().splitlines()[0]}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              if results:
                  fh.write(f"### Semgrep project rules: {len(results)} blocking finding(s)\n\n")
                  fh.write("\n".join(lines) + "\n")
              else:
                  fh.write(f"### Semgrep project rules: no findings over {scanned} scanned file(s)\n")
              if errors:
                  fh.write(f"\n{len(errors)} scan error(s); see the uploaded report.\n")

          print(f"semgrep: {len(results)} finding(s) over {scanned} scanned file(s)")
          sys.exit(status)
          PY


      - name: Semgrep - registry rules (advisory, never blocking)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --metrics=off \
            --disable-version-check \
            --json --output semgrep-registry.json \
            --text || true
          echo "### Semgrep registry rules ran in advisory mode - see the artifact" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-reports
          path: semgrep-*.json
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # sca-python - pip-audit plus a CycloneDX SBOM.
  # Audits the CI toolchain itself as well as any project requirements that exist, so the
  # tools that check our dependencies are themselves checked.
  # ===================================================================================
  sca-python:
    name: sca-python (pip-audit + SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned toolchain
        run: python -m pip install -r security/requirements-ci.txt

      - name: Enumerate Python dependency manifests
        id: manifests
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Tracked files only - an untracked requirements.txt is not something we ship.
          git ls-files \
            | grep -E '(^|/)requirements[^/]*\.txt$' \
            | grep -v '^security/requirements-ci\.txt$' > project-reqs.txt || true
          echo "Project requirement files found: $(wc -l < project-reqs.txt)"
          cat project-reqs.txt || true

      - name: pip-audit - CI toolchain manifest
        run: pip-audit --strict --requirement security/requirements-ci.txt --desc

      - name: pip-audit - the installed environment
        # Audits what pip actually RESOLVED AND INSTALLED, not what the manifest declares.
        # These differ in a way that matters: a manifest expresses ranges, and a transitive
        # dependency's vulnerability only exists at a concrete version. Measured on
        # 2026-08-31 - OSV-Scanner's static resolution of this same requirements file
        # reported 7 advisories (up to CVSS 8.6) against python-multipart 0.0.9, the FLOOR
        # of a transitive `>=0.0.9` constraint from semgrep. pip installs 0.0.32, which is
        # above every one of those fixes. The finding was an artefact of resolving a
        # manifest instead of an environment.
        #
        # That is also why OSV-Scanner gates sca-node but not sca-python: package-lock.json
        # pins exact resolved versions, so OSV's answer is the truth there, while a
        # requirements file does not, so it is not the truth here. A scanner pointed at the
        # wrong artefact fails the build for a version that is never installed, and a gate
        # that cries wolf is a gate people learn to re-run until it passes.
        run: pip-audit --strict --desc

      - name: pip-audit - project requirements
        run: |
          set -euo pipefail
          # This branch used to `exit 0` with "no project requirements files yet".
          # That reason went stale on 2026-08-31: security/scan-targets.yml now registers
          # four python_projects and `git ls-files` finds 7 requirements files, so an
          # empty project-reqs.txt no longer means "not yet". It means the enumeration
          # broke - the `|| true` on the git|grep pipeline above hides a git failure
          # exactly as well as it hides grep's legitimate no-match - or a project lost
          # its manifest. Both are release-blocking and neither is a reason to pass.
          #
          # The empty-result tell from PLAN.md in its purest form: the passing state was
          # an empty file, and an empty file looks the same whether nothing needed
          # auditing or nothing got enumerated. This now asserts the subject set is
          # non-empty BEFORE concluding that nothing is wrong with it.
          n=$(wc -l < project-reqs.txt)
          if [ "$n" -eq 0 ]; then
            {
              echo "### sca-python: FAILED - no project requirements files were enumerated"
              echo ""
              echo "\`security/scan-targets.yml\` registers \`python_projects\`, so this set"
              echo "cannot legitimately be empty. Skipping here would audit the CI toolchain"
              echo "only and then call the run green."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: project-reqs.txt is empty while scan-targets.yml registers python_projects." >&2
            echo "      That audits nothing but the CI toolchain; refusing to call it a pass." >&2
            exit 1
          fi
          echo "auditing ${n} project requirement file(s)"
          # Audit EVERY file, then fail. Under `set -e` this loop used to abort on the
          # first vulnerable manifest, so the first real CI run reported one advisory in
          # analytics/cdc/requirements-dev.txt and never looked at the other five. A gate
          # that stops at the first finding turns remediation into a sequence of CI runs
          # and makes the true blast radius unknowable from any single one of them.
          failed=""
          while read -r req; do
            echo "::group::pip-audit $req"
            if ! pip-audit --strict --requirement "$req" --desc; then
              failed="${failed}${req} "
            fi
            echo "::endgroup::"
          done < project-reqs.txt
          {
            echo "### sca-python audited ${n} project requirement file(s)"
            sed 's/^/- `/;s/$/`/' project-reqs.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            {
              echo ""
              echo "**Vulnerable:** $(echo "$failed" | sed 's/ $//;s/ /, /g')"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: known vulnerabilities in: ${failed}" >&2
            exit 1
          fi


      - name: CycloneDX SBOM
        run: |
          set -euo pipefail
          cyclonedx-py requirements security/requirements-ci.txt \
            --of JSON -o sbom/sbom-python-ci-toolchain.cdx.json
          if [ -s project-reqs.txt ]; then
            while read -r req; do
              slug="$(echo "$req" | tr '/.' '--')"
              cyclonedx-py requirements "$req" \
                --of JSON -o "sbom/sbom-python-${slug}.cdx.json"
            done < project-reqs.txt
          fi
          ls -la sbom/

      - name: Upload Python SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python
          path: sbom/
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # sca-node - npm audit AND OSV-Scanner, plus a CycloneDX SBOM, per registered project.
  #
  # The matrix is generated from security/scan-targets.yml and always contains every
  # registered project, including ones whose directory does not exist yet. Those run and
  # report an explicit SKIP. A matrix that simply omitted them would be a green tick for
  # a service nobody scanned.
  # ===================================================================================
  sca-node:
    name: sca-node (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.node) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report skip (project not built yet)
        if: ${{ !matrix.scan }}
        run: |
          {
            echo "### sca-node: \`${{ matrix.name }}\` SKIPPED"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| path | \`${{ matrix.path }}\` |"
            echo "| owner | ${{ matrix.owner }} |"
            echo "| arrives in wave | ${{ matrix.wave }} |"
            echo "| registered status | ${{ matrix.status }} |"
            echo ""
            echo "No \`package.json\` at that path yet. This job exists now so the service is"
            echo "scanned by its first commit rather than by a workflow edit somebody has to"
            echo "remember. Registered in \`security/scan-targets.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=sca-node skipped::${{ matrix.name }} not present yet (owner ${{ matrix.owner }}, wave ${{ matrix.wave }})"

      - name: Set up Node
        if: ${{ matrix.scan }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        # --ignore-scripts: an npm install script is arbitrary code execution from a
        # transitive dependency, running on a runner that has our source checked out.
        # We are installing in order to audit, not in order to run anything.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning title=No lockfile::${{ matrix.name }} has no package-lock.json; audit results are not reproducible"
            npm install --ignore-scripts --package-lock-only
          fi

      - name: npm audit (fails on high or critical)
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high

      - name: Install OSV-Scanner (version + checksum pinned)
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/

      - name: OSV-Scanner
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          mkdir -p reports
          # Machine-readable report first, non-gating. `set -e` plus a scanner that exits
          # non-zero on findings would abort before the artefact is written, so a failing
          # scan would upload nothing - exactly when the report matters most.
          osv-scanner scan source --recursive \
            --format json --output "reports/osv-${{ matrix.slug }}.json" \
            "${{ matrix.path }}" || true
          # This run is the gate.
          osv-scanner scan source --recursive "${{ matrix.path }}"

      - name: CycloneDX SBOM
        if: ${{ matrix.scan }}
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          # Absolute path: `../` is the repository root only while every registered Node
          # project sits at the top level. A nested path would write the SBOM somewhere
          # the upload step does not look, and the artefact would silently be empty.
          npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
            --output-format JSON \
            --output-file "${GITHUB_WORKSPACE}/sbom-node-${{ matrix.slug }}.cdx.json" \
            --omit dev

      - name: Upload SBOM and reports
        if: ${{ always() && matrix.scan }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-node-${{ matrix.slug }}
          path: |
            sbom-node-*.cdx.json
            reports/
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # secrets - gitleaks over the working tree AND the full history.
  # History matters: a secret that was committed and then deleted is still in the object
  # database, still fetchable, and still leaked. Scanning only HEAD would call that clean.
  # ===================================================================================
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (version + checksum pinned)
        # Deliberately not gitleaks/gitleaks-action: v2 of that action requires a
        # GITLEAKS_LICENSE for organization-owned repositories, which would make the
        # secret gate depend on a licence key nobody has provisioned yet. A pinned
        # release asset verified against its published SHA-256 has no such dependency
        # and is, if anything, a tighter supply-chain guarantee.
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan working tree
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks-tree.sarif

      - name: Scan full history (every ref, every commit)
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact --no-banner --verbose \
            --log-opts="--all --full-history" \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload gitleaks reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # hadolint - every Dockerfile in the tree, not only the registered ones. A Dockerfile
  # that is not in the registry is already a failure in `discover`; it should not also be
  # unlinted while somebody argues about whether it counts.
  # ===================================================================================
  hadolint:
    name: hadolint (every Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint (version + checksum pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/
          hadolint --version

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files | grep -iE '(^|/)dockerfile([^/]*)?$' || true)
          # This used to `exit 0` on an empty set, "reported rather than passed quietly".
          # Reporting is not enough: an exit code of 0 IS a pass to every consumer, and
          # only a human reading the summary would see the report (PLAN.md instance 11 -
          # a skip must never share an exit code with a pass).
          #
          # It is also an impossible state rather than an early-phase one.
          # security/scan-targets.yml registers six images `present`, `odoo/Dockerfile`
          # among them, so zero tracked Dockerfiles means the `git ls-files | grep`
          # pipeline broke - and the `|| true` that absorbs grep's legitimate no-match
          # absorbs a git failure identically. Fail, and name the expectation.
          if [ "${#files[@]}" -eq 0 ]; then
            {
              echo "### hadolint: FAILED - no Dockerfile found in the tree"
              echo ""
              echo "\`security/scan-targets.yml\` registers images as \`present\`, including"
              echo "\`odoo/Dockerfile\`, so an empty set is a broken enumeration, not an empty"
              echo "repository. Linting nothing is not the same as linting cleanly."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: git ls-files matched no Dockerfile while scan-targets.yml registers six." >&2
            exit 1
          fi
          printf 'Linting %d Dockerfile(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::hadolint $f"
            hadolint --config .hadolint.yaml "$f" || status=1
            echo "::endgroup::"
          done
          {
            echo "### hadolint linted ${#files[@]} Dockerfile(s)"
            printf -- '- `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ===================================================================================
  # container-scan - Trivy over every image this repository builds.
  #
  # Master prompt 5.2: no new image ships unscanned. The matrix comes from
  # security/scan-targets.yml and lists every image the PLAN says will exist. Images that
  # do not exist yet run and report an explicit SKIP with owner and wave. They are never
  # absent from the matrix, because "absent" and "clean" look identical in a job list.
  # ===================================================================================
  container-scan:
    name: container-scan (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report skip (image not built yet)
        if: ${{ !matrix.scan }}
        run: |
          {
            echo "### container-scan: \`${{ matrix.name }}\` SKIPPED"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| dockerfile | \`${{ matrix.dockerfile }}\` |"
            echo "| owner | ${{ matrix.owner }} |"
            echo "| arrives in wave | ${{ matrix.wave }} |"
            echo "| registered status | ${{ matrix.status }} |"
            echo ""
            echo "The Dockerfile does not exist yet. The moment it lands this job scans it -"
            echo "no workflow edit, no request, no window in which the image is unscanned."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=container-scan skipped::${{ matrix.name }} not built yet (owner ${{ matrix.owner }}, wave ${{ matrix.wave }})"

      - name: Build image
        if: ${{ matrix.scan }}
        run: |
          set -euo pipefail
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "bct-scan/${{ matrix.slug }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"

      - name: Trivy - fixable CRITICAL/HIGH (blocking)
        if: ${{ matrix.scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          # ignore-unfixed: a base-image CVE with no upstream patch cannot be actioned by
          # this repository. Blocking on it would mean the only way to a green build is a
          # .trivyignore entry, and a policy that forces suppression teaches suppression.
          # Unfixed findings are still collected in the advisory step below and uploaded.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          scanners: vuln,secret,misconfig

      - name: Trivy - full report including unfixed (advisory)
        if: ${{ matrix.scan }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: trivy-${{ matrix.slug }}.json
          scanners: vuln,secret,misconfig

      - name: Trivy - CycloneDX SBOM of the built image
        if: ${{ matrix.scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bct-scan/${{ matrix.slug }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-image-${{ matrix.slug }}.cdx.json

      - name: Upload image reports
        if: ${{ always() && matrix.scan }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan-${{ matrix.slug }}
          path: |
            trivy-*.json
            sbom-image-*.cdx.json
          if-no-files-found: warn
          retention-days: 90

  # ===================================================================================
  # fs-scan - Trivy over the repository itself: dependency manifests, IaC misconfiguration
  # (compose files, Dockerfiles) and secrets. Catches what a per-image scan cannot, such
  # as a container running privileged in docker-compose.yml.
  # ===================================================================================
  fs-scan:
    name: fs-scan (trivy filesystem + config)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          scanners: vuln,secret,misconfig

      - name: Trivy config scan - full report (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
          format: json
          output: trivy-config.json

      - name: Upload filesystem scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-scan-reports
          path: trivy-config.json
          if-no-files-found: warn
          retention-days: 30

  # ===================================================================================
  # dbt-ci - ENABLED in Phase 5. Replaces the Phase 1 `if: false` placeholder.
  #
  # Runs in TIERS, and reports which tier ran. This matters more than it looks: a dbt
  # job that silently degrades to "parse only" while claiming to be a build gate is the
  # dominant defect pattern in this build (PLAN.md - a check that returns the
  # right-looking answer for the wrong reason). So each tier states what it proved.
  #
  #   tier 1  dbt deps + dbt parse      no database needed. Catches broken refs, bad
  #                                     YAML, missing macros, circular dependencies.
  #   tier 2  dbt compile               real Postgres service + the warehouse schema
  #                                     and roles from analytics/warehouse/init/sql.
  #                                     Proves every model renders against the real
  #                                     adapter as the NOSUPERUSER `warehouse` role.
  #   tier 3  dbt build + dbt test      needs seeded raw_* sources. Runs only when the
  #                                     fixture entrypoint below exists; otherwise the
  #                                     job reports an explicit SKIP with the reason.
  #
  # THE FIXTURE CONTRACT, owed by Data-Warehouse + QA via the Lead:
  #     scripts/analytics/dbt-ci-fixture.sh
  #   Must seed the raw_* source tables into $WAREHOUSE_DB so `dbt build` has data,
  #   be idempotent, and exit non-zero on failure. When it lands, tier 3 turns on by
  #   itself - no edit to this file. Until then tier 3 is SKIPPED AND REPORTED, never
  #   silently passed.
  # ===================================================================================
  dbt-ci:
    name: dbt-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Scoped to changes that can affect the warehouse. A dbt gate that runs on every
    # README edit gets ignored, and an ignored gate is not a gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    services:
      warehouse-db:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: ci-only-not-a-secret
      # ABSOLUTE, deliberately. This was `analytics/dbt`, a RELATIVE path, while tiers 1
      # and 2 run with `working-directory: analytics/dbt` - so dbt resolved
      # `analytics/dbt/analytics/dbt` and died with "Path 'analytics/dbt' does not exist"
      # on the first real CI run. The path existed; the cwd it was resolved against was
      # not the one it was written for. A value whose meaning depends on the caller's
      # working directory is the same defect class as a guard that depends on a file mode
      # this repo cannot record: make it independent of the caller.
      DBT_PROFILES_DIR: ${{ github.workspace }}/analytics/dbt
      DBT_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Does this change touch analytics/?
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base" "$head" | grep -q '^analytics/'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "### dbt-ci: no analytics/ changes in this PR - not run" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dbt
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r analytics/dbt/requirements.txt

      - name: Create the warehouse role and schemas
        if: steps.scope.outputs.run == 'true'
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          # The same init SQL the real warehouse uses, so CI exercises the real roles.
          # dbt connects as `warehouse` (NOSUPERUSER NOBYPASSRLS), never as postgres -
          # a superuser ignores row security and every isolation test would pass while
          # proving nothing (THREAT-MODEL.md T-1).
          #
          # 2026-08-31 - THIS STEP WAS A NO-OP THAT REPORTED SUCCESS. Every file here
          # needs six psql variables (:wh_user, :wh_password, :loader_user,
          # :loader_password, :rls_user, :rls_password) which bin/warehouse-apply.sh
          # supplies with -v and this step did not. Measured on a throwaway
          # postgres:16-alpine: 5 of the 6 files aborted with `syntax error at or near
          # ":"`, and the trailing `|| true` on the psql call swallowed all five - so the
          # step was green while `raw`, `staging`, `marts` and `snapshots` were never
          # created and the three non-superuser roles never existed. Tiers 1 and 2 still
          # passed because a hand-rolled CREATE ROLE papered over the one role they
          # touch. That block is now gone: it also did GRANT ALL ON DATABASE, which
          # 40-grants.sql does not, so CI was exercising a role production never has.
          #
          # Three properties this step must keep:
          #   1. no `|| true` - ON_ERROR_STOP=1 is worthless if the shell discards it;
          #   2. assert the glob matched a non-empty set, because a zero-iteration loop
          #      is indistinguishable from six clean applications (PLAN.md, empty-result);
          #   3. assert the schemas exist afterwards, because "psql exited 0" and "the
          #      schema is there" are different claims.
          shopt -s nullglob
          files=(analytics/warehouse/init/sql/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "FAIL: analytics/warehouse/init/sql/*.sql matched no files. That DDL is owned by" >&2
            echo "      Data-Warehouse and is required. An empty set is a broken checkout, not an" >&2
            echo "      empty warehouse." >&2
            exit 1
          fi
          echo "applying ${#files[@]} init SQL file(s)"
          for f in "${files[@]}"; do
            echo "::group::$f"
            psql -h localhost -U postgres -d warehouse -v ON_ERROR_STOP=1 \
              -v wh_user=warehouse            -v wh_password=ci-only-not-a-secret \
              -v loader_user=warehouse_loader -v loader_password=ci-only-not-a-secret \
              -v rls_user=warehouse_rls       -v rls_password=ci-only-not-a-secret \
              -f "$f"
            echo "::endgroup::"
          done
          # Positive assertion: name the subject set, so "found nothing" cannot be read
          # as "nothing wrong".
          got=$(psql -h localhost -U postgres -d warehouse -tAc \
            "select count(*) from pg_namespace where nspname in ('raw','staging','marts','warehouse','snapshots');")
          if [ "$got" != "5" ]; then
            echo "FAIL: expected 5 warehouse schemas after the init SQL, found ${got}." >&2
            exit 1
          fi
          psql -h localhost -U postgres -d warehouse \
            -c "select nspname from pg_namespace where nspname in ('raw','staging','marts','warehouse','snapshots') order by 1;"
          echo "### dbt-ci: ${#files[@]} init SQL file(s) applied; 5 schemas present" >> "$GITHUB_STEP_SUMMARY"


      - name: Prove dbt is NOT connecting as a superuser
        if: steps.scope.outputs.run == 'true'
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          # Identity first, per THREAT-MODEL.md T-1. Column form, not concatenated:
          # rolsuper renders true/false through `||`, never psql's t/f, so a string
          # comparison would never match and would pass forever.
          psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 \
            -c "select current_user, rolsuper, rolbypassrls from pg_roles where rolname = current_user;"
          bad=$(psql -h localhost -U warehouse -d warehouse -tAc \
            "select count(*) from pg_roles where rolname = current_user and (rolsuper or rolbypassrls);")
          if [ "$bad" != "0" ]; then
            echo "FAIL: dbt's role is a superuser or can bypass RLS. Every isolation test would pass while proving nothing." >&2
            exit 1
          fi
          echo "role identity OK: not superuser, cannot bypass RLS"

      - name: "Tier 1 - dbt deps + parse (no database)"
        if: steps.scope.outputs.run == 'true'
        working-directory: analytics/dbt
        run: |
          set -euo pipefail
          dbt deps
          dbt parse
          echo "### dbt-ci tier 1: deps + parse PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: "Tier 2 - dbt compile against a real adapter"
        if: steps.scope.outputs.run == 'true'
        working-directory: analytics/dbt
        run: |
          set -euo pipefail
          dbt compile
          echo "### dbt-ci tier 2: compile PASSED (real Postgres, non-superuser role)" >> "$GITHUB_STEP_SUMMARY"

      - name: "Tier 3 - dbt build + test, or an explicit skip"
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          FIXTURE=scripts/analytics/dbt-ci-fixture.sh

          # ---------------------------------------------------------------------------
          # THIS GUARD TESTED `-x` UNTIL 2026-08-31, AND THAT WAS A LATENT FALSE SKIP.
          #
          # git on the development host records every file as mode 100644, because the
          # host is Windows with core.filemode=false. Platform-Infra found the repo-wide
          # form of this and fixed 15 scripts to 100755, correctly staying out of
          # scripts/analytics/, which is Backend's path and where all six files are still
          # 100644. So the fixture, when Data-Warehouse and QA deliver it from that host,
          # lands NON-EXECUTABLE. `[ ! -x ]` would still be true, tier 3 would still skip,
          # and the summary would say the file "does not exist" - which by then is false.
          # A delivered, committed, believed-active fixture, silently never executed, with
          # CI green. Exactly the dominant defect pattern in PLAN.md.
          #
          # The fix is to stop asking a question whose answer depends on a bit this repo
          # cannot reliably record. Test `-f` (is it there) and invoke `bash "$FIXTURE"`.
          # Mode-independent, and the same way every other caller in this repo runs an
          # analytics script - tests/helpers/loader.py:26 uses
          # ["bash", "scripts/analytics/cdc-run.sh", ...].
          # ---------------------------------------------------------------------------

          # Exists but is not a regular file - a directory, a dangling symlink, a socket.
          # Kept as its own branch and FATAL, because it must not reach the skip below,
          # whose message would then be a lie. "I could not run it" and "there is nothing
          # to run" are different facts and must not share an outcome.
          if [ -e "$FIXTURE" ] && [ ! -f "$FIXTURE" ]; then
            {
              echo "### dbt-ci tier 3: FAILED - fixture path is not a regular file"
              echo ""
              echo "\`${FIXTURE}\` exists but is not a regular file. Refusing to report this"
              echo "as \"no fixture\": that would be a false reason on a green run."
            } >> "$GITHUB_STEP_SUMMARY"
            ls -ld "$FIXTURE" >&2 || true
            echo "FAIL: ${FIXTURE} exists but is not a regular file." >&2
            exit 1
          fi

          if [ ! -e "$FIXTURE" ]; then
            {
              echo "### dbt-ci tier 3: SKIPPED - no seeded fixture"
              echo ""
              echo "\`${FIXTURE}\` does not exist, so there are no \`raw_*\` sources for"
              echo "\`dbt build\` to read. Tiers 1 and 2 ran and passed."
              echo ""
              echo "**This is a reported skip, not a pass.** The fixture is owed by"
              echo "Data-Warehouse and QA via the Lead; it must seed the raw_* tables,"
              echo "be idempotent, and exit non-zero on failure. It does NOT need to be"
              echo "executable - it is invoked as \`bash ${FIXTURE}\`."
              echo ""
              echo "A \`run:\` step has only two outcomes, so this skip cannot be given an"
              echo "exit code distinct from a pass (PLAN.md instance 11). The control that"
              echo "makes it EXPIRE is therefore a different job: \`ci_fixtures\` in"
              echo "\`security/scan-targets.yml\` is checked by \`discover\`, which fails"
              echo "the build once the fixture is registered \`present\` and then goes"
              echo "missing, and warns loudly the moment it lands while still \`pending\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=dbt-ci tier 3 skipped::No ${FIXTURE}; dbt build did not run"
            exit 0
          fi

          echo "seeding fixture via: bash ${FIXTURE}"
          ls -l "$FIXTURE"
          bash "$FIXTURE"
          cd analytics/dbt
          dbt build
          {
            echo "### dbt-ci tier 3: build + test PASSED against the seeded fixture"
            echo ""
            echo "Fixture invoked as \`bash ${FIXTURE}\`; its file mode is not consulted."
          } >> "$GITHUB_STEP_SUMMARY"


  # ===================================================================================
  # ci-gate - the single required status check.
  #
  # Phase 5 CD depends on THIS job and nothing else. It fails if any job above failed or
  # was cancelled, so a new job added to this workflow tightens the gate automatically
  # and cannot be forgotten in a branch-protection setting nobody remembers to update.
  #
  # NO job may be skipped: `permitted_skips` below is empty. The Phase 1 exemption for
  # dbt-ci died with its `if: false` placeholder, and an exemption that outlives its
  # reason is a permanent hole in the gate.
  # ===================================================================================
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - discover
      - lint
      - sast
      - sca-python
      - sca-node
      - secrets
      - hadolint
      - container-scan
      - fs-scan
      - dbt-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          # NO job may be skipped. The Phase 1 exemption for dbt-ci existed only while
          # that job was `if: false`; Phase 5 made it real, so the exemption was removed.
          # An exemption that outlives its reason is a permanent hole in the gate.
          permitted_skips = set()

          failed, skipped = [], []
          print(f"{'job':<20} result")
          print("-" * 32)
          for name, data in sorted(results.items()):
              outcome = data.get("result")
              print(f"{name:<20} {outcome}")
              if outcome in ("failure", "cancelled"):
                  failed.append(f"{name}={outcome}")
              elif outcome == "skipped" and name not in permitted_skips:
                  skipped.append(name)

          summary = []
          if failed:
              summary.append("FAILED: " + ", ".join(failed))
          if skipped:
              summary.append(
                  "UNEXPECTEDLY SKIPPED: " + ", ".join(skipped) +
                  " - a skipped job is not a passing job; find out why it did not run"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## ci-gate\n\n| job | result |\n|---|---|\n")
              for name, data in sorted(results.items()):
                  fh.write(f"| {name} | {data.get('result')} |\n")
              fh.write("\n**" + ("CI_GATE_FAIL" if summary else "CI_GATE_PASS") + "**\n")
              for line in summary:
                  fh.write(f"\n- {line}\n")

          if summary:
              print("\n".join(summary), file=sys.stderr)
              print("CI_GATE_FAIL", file=sys.stderr)
              sys.exit(1)
          print("CI_GATE_PASS")
          PY
